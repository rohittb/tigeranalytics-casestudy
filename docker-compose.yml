services:
  db:
    image: postgres:16-alpine
    container_name: retail_pricing_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-retail_pricing}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-retail_pricing}"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - retail_pricing_net

  redis:
    image: redis:7-alpine
    container_name: retail_pricing_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - retail_pricing_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail_pricing_api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-retail_pricing}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      MAX_DATA_ROWS: ${MAX_DATA_ROWS:-50000}
      MAX_COLUMNS: ${MAX_COLUMNS:-50}
      DB_BATCH_SIZE: ${DB_BATCH_SIZE:-1000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8080}:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retail_pricing_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail_pricing_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-retail_pricing}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      MAX_DATA_ROWS: ${MAX_DATA_ROWS:-50000}
      MAX_COLUMNS: ${MAX_COLUMNS:-50}
      DB_BATCH_SIZE: ${DB_BATCH_SIZE:-1000}
    volumes:
      - ./backend:/app
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retail_pricing_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail_pricing_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - retail_pricing_net

volumes:
  postgres_data:
  uploads_data:

networks:
  retail_pricing_net:
    driver: bridge
